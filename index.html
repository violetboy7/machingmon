<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>매칭몬 도감</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매칭몬 도감">
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 실제 도감 이미지와 같은 6열 원형 판. 캡처해서 공유하는 그림이 곧 결과물이라 어두운 판 하나로 고정 */
:root {
  color-scheme: dark;
  --page: #141414;
  --board: #1E1E1E;
  --panel: #262626;
  --panel-2: #303030;
  --line: #3E3E3E;
  --text: #F2F2F2;
  --muted: #8C8C8C;
  --accent: #FFD43B;
  --danger: #FF5A5F;
  --gold: #E8B931;
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-title: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --gap: clamp(8px, 2.6vw, 22px);
  --cell: min(76px, calc((100vw - 32px - 24px - 5 * var(--gap)) / 6));
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--text); }
body { font-family: var(--font-ui); -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상단 도구 막대 */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding-block: 10px; background: var(--page); max-width: 560px; margin: 0 auto; }
.bar .status { margin-right: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: #51CF66; } .dot.warn { background: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 11px; border-radius: 9px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:active { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1E1E1E; font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.dupline { max-width: 560px; margin: 0 auto 8px; font-size: 12px; color: #FFC9C9; background: #3A1D20; border: 1px solid #5C2A2E; border-radius: 9px; padding: 7px 10px; }

/* 도감 */
.board { background: var(--board); border-radius: 6px; padding: 18px 12px 30px; max-width: 560px; margin: 0 auto; position: relative; }
.grid { display: grid; grid-template-columns: repeat(6, var(--cell)); column-gap: var(--gap); row-gap: calc(var(--gap) * 0.6 + 14px); justify-content: center; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 9px; min-width: 0; }
.num { font-size: clamp(9px, 2.6vw, 12px); color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: .02em; }
.cell { width: var(--cell); height: var(--cell); border-radius: 50%; border: 0; padding: 0; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; transition: transform .12s; }
.cell:active { transform: scale(.95); }
.cell.edge { box-shadow: inset 0 0 0 1.5px #555; }
.cell .nm { font-weight: 900; letter-spacing: -.04em; white-space: nowrap; }
.cell .s1 { font-size: calc(var(--cell) * .3); }
.cell .s2 { font-size: calc(var(--cell) * .22); }
.cell .more { font-size: calc(var(--cell) * .15); font-weight: 700; opacity: .85; }
.cell.sel { box-shadow: 0 0 0 3px var(--board), 0 0 0 5px #fff; }
.cell .cert { font-size: calc(var(--cell) * .19); line-height: 1; margin-bottom: calc(var(--cell) * .01); filter: drop-shadow(0 0 1px rgba(0,0,0,.55)) drop-shadow(0 0 2px rgba(0,0,0,.25)); }
.owner .ocert { font-size: .85em; margin-right: 1px; }
.cell.dup::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2.5px dashed var(--danger); pointer-events: none; }
.badge { position: absolute; left: 50%; transform: translateX(-50%); font-size: clamp(8px, 2.3vw, 10.5px); font-weight: 700; padding: 1px 5px; border-radius: 8px; white-space: nowrap; pointer-events: none; z-index: 3; line-height: 1.4; }
.badge.mgr { top: -10px; display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px 1px 5px; color: #2A2440; font-weight: 800; letter-spacing: -.02em;
  background: linear-gradient(180deg, #FFFFFF 0%, #E4DDF5 100%); border: 1px solid #B9A8E6; box-shadow: 0 0 0 2px var(--board), 0 1px 2px rgba(0,0,0,.35); }
.badge.mgr .star { color: #E8B931; font-size: 1.05em; line-height: 1; text-shadow: 0 0 1px rgba(120,80,0,.5); }
.badge.dup { bottom: -6px; background: var(--danger); color: #fff; }

.owner .cell { background-color: #141414; background-size: cover; background-position: center; box-shadow: inset 0 0 0 2px var(--gold); }
.owner .cell.sel { box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 3px var(--board), 0 0 0 5px #fff; }
.owner .crown { position: absolute; top: calc(var(--cell) * -.27); font-size: calc(var(--cell) * .3); line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.owner .oname { font-weight: 900; font-size: calc(var(--cell) * .24); line-height: 1; white-space: nowrap; }
.title { grid-column: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; align-self: start; height: var(--cell); gap: 4px;
  font-family: var(--font-title); font-size: calc(var(--cell) * .42); color: #fff; white-space: nowrap; letter-spacing: .02em; }

/* 칸 메뉴 */
.title .count { font-family: var(--font-ui); font-size: calc(var(--cell) * .2); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.menu { position: absolute; z-index: 30; width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.55); }
.menu .head { grid-column: span 2; font-size: 12px; color: var(--muted); padding: 2px 4px; display: flex; align-items: center; gap: 6px; }
.menu .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; background-size: cover; }
.menu .btn { padding: 10px 6px; font-size: 14px; }
.menu .wide { grid-column: span 2; }
.menu .on { border-color: var(--accent); color: var(--accent); }

/* 대화상자 */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.62); display: flex; align-items: flex-start; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 8vh) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.dialog { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.dialog h2 { margin: 0 0 4px; font-size: 17px; }
.dialog p { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.55; }
.row { display: flex; gap: 6px; margin-bottom: 8px; }
.row input { flex: 1; min-width: 0; padding: 10px; border-radius: 9px; border: 1px solid var(--line); background: #1A1A1A; color: var(--text);
  font: 900 22px var(--font-ui); text-align: center; letter-spacing: .15em; }
.row .btn { padding: 0 12px; }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 4px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

.dialog.shot { max-width: 420px; }
.dialog.shot img { display: block; width: 100%; height: auto; border-radius: 6px; -webkit-touch-callout: default; user-select: auto; }
.field { display: block; margin-bottom: 10px; }
.field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: #1A1A1A; color: var(--text); font: 500 16px var(--font-ui); }
.hist { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; }
.hist .item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: #1C1C1C; font-size: 13px; }
.hist .item .when { font-variant-numeric: tabular-nums; min-width: 0; flex: 1; }
.hist .item .cnt { color: var(--muted); font-size: 12px; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); z-index: 80;
  background: #000; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: calc(100vw - 32px); text-align: center; }

/* 캡처 모드: 도감만 */
body.capture .bar, body.capture .dupline, body.capture .menu { display: none !important; }
body.capture .cell.sel { box-shadow: none; }
body.capture .owner .cell.sel { box-shadow: inset 0 0 0 2px var(--gold); }
body.capture .board { margin-top: 12px; }

@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
</style>
</head>
<body>


<div class="bar" id="bar">
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">불러오는 중…</span></div>
  <button class="btn" id="undoBtn" disabled>되돌리기</button>
  <button class="btn" id="clearHlBtn">인증 전체 해제</button>
  <button class="btn primary" id="captureBtn">이미지 저장</button>
  <button class="btn primary" id="clipBtn">클립보드 복사</button>
  <button class="btn danger" id="resetBtn">초기화</button>
  <button class="btn" id="histBtn" hidden>복원</button>
</div>
<div class="dupline" id="dupline" hidden></div>

<div class="board" id="board">
  <div class="grid" id="grid"></div>
  <div class="menu" id="menu" hidden></div>
</div>

<div class="modal" id="editModal" hidden>
  <form class="dialog" id="editForm" autocomplete="off">
    <h2 id="editTitle">닉네임 수정</h2>
    <p>두 글자로 입력하세요. 같은 색을 쓰는 사람이 여럿이면 이름을 추가하세요.</p>
    <div id="rows"></div>
    <button type="button" class="btn" id="addRow">+ 이름 추가</button>
    <div class="err" id="editErr"></div>
    <div class="actions">
      <button type="button" class="btn" data-close>취소</button>
      <button type="submit" class="btn primary">확인</button>
    </div>
  </form>
</div>

<div class="modal" id="resetModal" hidden>
  <div class="dialog">
    <h2>도감 초기화</h2>
    <p>모든 닉네임, 하이라이트, 부방장 표시를 지웁니다. 방장 칸과 색은 그대로입니다. 직후에는 [되돌리기]로 되돌릴 수 있습니다.</p>
    <div class="actions">
      <button type="button" class="btn" data-close>취소</button>
      <button type="button" class="btn danger" id="resetOk">초기화</button>
    </div>
  </div>
</div>

<div class="modal" id="shotModal" hidden>
  <div class="dialog shot">
    <h2>캡처 이미지</h2>
    <p id="shotMsg">이미지를 길게 눌러 사진에 저장하세요.</p>
    <img id="shotImg" alt="매칭몬 도감 캡처 이미지">
    <div class="actions">
      <button type="button" class="btn" data-close>닫기</button>
      <button type="button" class="btn primary" id="shotSave">다시 저장</button>
    </div>
  </div>
</div>

<div class="modal" id="histModal" hidden>
  <div class="dialog">
    <h2>이전 상태로 복원</h2>
    <p>수정할 때마다 직전 상태가 최대 30개까지 자동으로 저장됩니다. 누가 잘못 고쳤거나 지웠다면 여기서 되돌리세요.</p>
    <div class="hist" id="histList"></div>
    <div class="actions"><button type="button" class="btn" data-close>닫기</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

function emptyBoard() {
  const cells = Array.from({ length: N }, () => ({ names: [], hl: false, mgr: false }));
  cells.push({ names: ['주영'], hl: false, mgr: false });
  return { cells };
}
function normalize(b) {
  const base = emptyBoard();
  if (!b || !Array.isArray(b.cells)) return base;
  base.cells = base.cells.map((d, i) => {
    const c = b.cells[i] || {};
    return { names: Array.isArray(c.names) ? c.names.map(String).filter(Boolean) : d.names, hl: !!c.hl, mgr: !!c.mgr };
  });
  return base;
}

function toast(msg, ms = 2400) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms);
}
function status(text, kind) { $('statusText').textContent = text; $('dot').className = 'dot' + (kind ? ' ' + kind : ''); }

function lum(hex) {
  const v = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
}

const filledCount = () => S.cells.slice(0, N).filter(c => c.names.length).length;

function render() {
  const g = $('grid'); g.innerHTML = '';
  S.cells.forEach((c, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (i === OWNER ? ' owner' : '');
    const b = document.createElement('button');
    b.className = 'cell'; b.type = 'button';
    if (selected === i) b.classList.add('sel');
    let html = '';
    if (i === OWNER) {
      if (photo) b.style.backgroundImage = `url("${photo}")`;
      html = '<span class="crown" aria-hidden="true">👑</span>';
      b.setAttribute('aria-label', `방장 ${c.names.join(', ')}`);
    } else {
      const hex = PALETTE[i];
      b.style.background = hex;
      b.style.color = lum(hex) < .18 ? '#FFFFFF' : '#151515';
      if (lum(hex) < .02) b.classList.add('edge');
      const n = c.names;
      if (n.length > 1) b.classList.add('dup');
      if (c.hl) html += '<span class="cert" aria-label="인증">❄️</span>';
      if (n.length === 1) html += `<span class="nm s1">${esc(n[0])}</span>`;
      else if (n.length === 2) html += `<span class="nm s2">${esc(n[0])}</span><span class="nm s2">${esc(n[1])}</span>`;
      else if (n.length > 2) html += `<span class="nm s2">${esc(n[0])}</span><span class="more">외 ${n.length - 1}명</span>`;

// ---------- 저장 ----------
let saveTimer = null, saving = false, dirty = false, lastSaved = '';
function change(fn) {

  prev = clone(S);
  fn();
  afterChange();
}
function afterChange() {
  lsSet(); render();
  if (!boardRef) return;
  dirty = true;
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400);
}
async function flush() {
  if (!boardRef || saving || !dirty) return;
  saving = true; dirty = false;
  const body = clone(S), json = JSON.stringify(body);
  try {
    if (json !== lastSaved) { await boardRef.set(body); lastSaved = json; }
    status('저장됨', 'ok');
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'permission-denied')) { if (lastSaved) { S = normalize(JSON.parse(lastSaved)); prev = null; lsSet(); render(); } status('저장 거부됨 · 서버 규칙 확인 필요', 'warn'); toast('서버가 저장을 거부했습니다. Firestore 규칙을 확인하세요.', 4000); }
    else { status('저장 실패 · 이 기기에는 남아 있음', 'warn'); toast('저장하지 못했습니다. 잠시 후 다시 수정하면 다시 저장합니다.', 3500); }
  } finally {
    saving = false;
    if (dirty) flush();
  }
}

// ---------- 캡처: 화면 크기와 상관없이 항상 같은 규격의 PNG로 그림 ----------
const SHOT = { W: 1080, C: 132, PAD: 54, TOP: 64, NUM: 56, ROW: 30, BOTTOM: 48 };
SHOT.GAP = (SHOT.W - SHOT.PAD * 2 - SHOT.C * 6) / 5;
SHOT.H = SHOT.TOP + 8 * SHOT.C + 8 * SHOT.NUM + 7 * SHOT.ROW + SHOT.BOTTOM;
let lastShot = null;

function loadImg(src) {
  return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
function pill(ctx, cx, y, text, bg, fg, size) {
  ctx.font = `700 ${size}px ${FONT_UI}`;
  const w = ctx.measureText(text).width + size * 1.1, h = size * 1.55;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(cx - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, y + size * .04);
}
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT_UI = '"Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

async function drawShot() {
  const { W, H, C, PAD, TOP, NUM, ROW, GAP } = SHOT;
  const allText = S.cells.flatMap(c => c.names).join('') + '매칭몬도감부방장중복외명0123456789';
  try {
    await Promise.all([
      document.fonts.load(`900 40px "Noto Sans KR"`, allText),
      document.fonts.load(`700 40px "Noto Sans KR"`, allText),
      document.fonts.load(`500 40px "Noto Sans KR"`, '0123456789'),
      document.fonts.load(`40px "Jua"`, '매칭몬 도감')
    ]);
  } catch (_) {}
  const ph = await loadImg(photo);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#1E1E1E'; ctx.fillRect(0, 0, W, H);
  const k = C / 76; // 화면 대비 배율

  S.cells.forEach((c, i) => {
    const col = i % 6, row = Math.floor(i / 6);
    const cx = PAD + col * (C + GAP) + C / 2;
    const top = TOP + row * (C + NUM + ROW);
    const cy = top + C / 2, r = C / 2;

    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    if (i === OWNER) {
      ctx.save(); ctx.clip(); ctx.fillStyle = '#141414'; ctx.fillRect(cx - r, cy - r, C, C);
      if (ph) { const s = Math.min(ph.width, ph.height); ctx.drawImage(ph, (ph.width - s) / 2, (ph.height - s) / 2, s, s, cx - r, cy - r, C, C); }
      ctx.restore();
      ctx.strokeStyle = '#E8B931'; ctx.lineWidth = 2 * k; ctx.beginPath(); ctx.arc(cx, cy, r - k, 0, Math.PI * 2); ctx.stroke();
      ctx.font = `${C * .3}px ${EMOJI}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👑', cx, top - C * .12);
      ctx.fillStyle = '#FFFFFF'; ctx.font = `900 ${C * .24}px ${FONT_UI}`; ctx.textBaseline = 'alphabetic';
      ctx.fillText((c.hl ? '❄️' : '') + c.names.join(', '), cx, top + C + NUM * .78);
      return;
    }
    const hex = PALETTE[i];
    ctx.fillStyle = hex; ctx.fill();
    if (lum(hex) < .02) { ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5 * k; ctx.beginPath(); ctx.arc(cx, cy, r - .75 * k, 0, Math.PI * 2); ctx.stroke(); }
    const n = c.names;
    if (n.length > 1) {
      ctx.save(); ctx.setLineDash([6 * k, 4 * k]); ctx.strokeStyle = '#FF5A5F'; ctx.lineWidth = 2.5 * k;
      ctx.beginPath(); ctx.arc(cx, cy, r + 6 * k, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const dy = c.hl ? C * .08 : 0;
    if (c.hl) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 3 * k; ctx.font = `${C * .19}px ${EMOJI}`; ctx.fillText('❄️', cx, cy - C * (n.length > 1 ? .33 : .22)); ctx.restore(); }
    ctx.fillStyle = lum(hex) < .18 ? '#FFFFFF' : '#151515';
    ctx.save(); ctx.translate(0, n.length > 1 ? dy * .6 : dy);
    if (n.length === 1) { ctx.font = `900 ${C * .3}px ${FONT_UI}`; ctx.fillText(n[0], cx, cy + C * .015); }
    else if (n.length === 2) { ctx.font = `900 ${C * .22}px ${FONT_UI}`; ctx.fillText(n[0], cx, cy - C * .12); ctx.fillText(n[1], cx, cy + C * .12); }
    else if (n.length > 2) { ctx.font = `900 ${C * .22}px ${FONT_UI}`; ctx.fillText(n[0], cx, cy - C * .1); ctx.font = `700 ${C * .15}px ${FONT_UI}`; ctx.fillText(`외 ${n.length - 1}명`, cx, cy + C * .14); }
    ctx.restore();
    if (n.length > 1) pill(ctx, cx, top + C + 1 * k, `중복 ${n.length}`, '#FF5A5F', '#FFFFFF', 10.5 * k);
    if (c.mgr) {
      // 부방장 배지: 연보라 그라데이션 + 금색 별
      const fs = 10.5 * k, y = top - 1 * k;
      ctx.font = `800 ${fs}px ${FONT_UI}`;
      const tw = ctx.measureText('부방장').width, sw = fs * 1.05, w = tw + sw + fs * 1.15, h = fs * 1.6;
      const x0 = cx - w / 2, y0 = y - h / 2;
      ctx.save();
      ctx.fillStyle = '#1E1E1E'; ctx.beginPath(); ctx.roundRect(x0 - 2 * k, y0 - 2 * k, w + 4 * k, h + 4 * k, h / 2 + 2 * k); ctx.fill();
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 2 * k; ctx.shadowOffsetY = 1 * k;
      const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#E4DDF5');
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x0, y0, w, h, h / 2); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#B9A8E6'; ctx.lineWidth = 1 * k; ctx.stroke();
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      const sx = x0 + fs * .5;
      ctx.fillStyle = '#E8B931'; ctx.font = `${fs * 1.05}px ${FONT_UI}`; ctx.fillText('★', sx, y + fs * .02);
      ctx.fillStyle = '#2A2440'; ctx.font = `800 ${fs}px ${FONT_UI}`; ctx.fillText('부방장', sx + sw + fs * .1, y + fs * .05);
      ctx.restore();
    }
    ctx.fillStyle = '#8C8C8C'; ctx.font = `500 ${12 * k}px ${FONT_UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(i + 1), cx, top + C + NUM * .8);
  });

  // 제목 (마지막 줄 5~6번째 자리)
  const tx = PAD + 4 * (C + GAP) + (C * 2 + GAP) / 2, ty = TOP + 7 * (C + NUM + ROW) + C / 2;
  ctx.fillStyle = '#FFFFFF'; ctx.font = `${C * .42}px "Jua", ${FONT_UI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('매칭몬 도감', tx, ty - C * .1);
  ctx.fillStyle = '#8C8C8C'; ctx.font = `700 ${C * .2}px ${FONT_UI}`;
  ctx.fillText(`${filledCount()} / ${N}`, tx, ty + C * .3);
  return cv;
}

function stamp() {
  const d = new Date(), z = v => String(v).padStart(2, '0');
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`;
}
async function capture() {
  const btn = $('captureBtn'); btn.disabled = true; btn.textContent = '만드는 중…';
  try {
    const cv = await drawShot();
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    if (!blob) throw new Error('이미지를 만들지 못했습니다');
    lastShot = { blob, name: `matchingmon_${stamp()}.png` };
    $('shotImg').src = cv.toDataURL('image/png');
    const dl = true;

      + ` 크기는 항상 ${SHOT.W} × ${SHOT.H}입니다.`;
    $('shotModal').hidden = false;

  } catch (e) {
    toast('캡처 이미지를 만들지 못했습니다. 다시 눌러주세요.', 3000);
  } finally { btn.disabled = false; btn.textContent = '이미지 저장'; }
}
async function saveShot() {
  if (!lastShot) return;
  const file = new File([lastShot.blob], lastShot.name, { type: 'image/png' });
  // 휴대폰: 공유 창 → [이미지 저장] / PC: 파일 다운로드
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '매칭몬 도감' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(lastShot.blob); a.download = lastShot.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

}
$('shotSave').onclick = () => saveShot();
$('clipBtn').onclick = e => {

    .then(() => toast('클립보드에 복사했습니다. 카톡 입력창에 붙여넣으세요'))
    .catch(() => toast('복사하지 못했습니다. [이미지 저장]을 쓰세요.', 3500))

};

// ---------- Firebase 동기화 (로그인 없음) ----------
// 주소를 아는 사람은 누구나 수정. 대신 수정 직전 상태를 boards/history 에 최대 30개 보관
const HIST_MAX = 30, HIST_GAP_MS = 60 * 1000;
function initFirebase() {

  } catch (e) { status('서버 설정 오류 · 이 기기에만 저장됨', 'warn'); return; }
  try { store.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (_) {}
  fb.ready = true;
  const ref = store.doc('boards/main'), histRef = store.doc('boards/history');
  status('불러오는 중…', '');
  $('histBtn').hidden = false;

  boardRef = { set: async b => {
    await pushHistory(histRef);
    await ref.set({ cells: b.cells, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  } };
  photoRef = { set: p => ref.set({ photo: p.data }, { merge: true }) };

  const slow = setTimeout(() => status('서버에 연결하지 못함 · 저장된 내용 표시 중', 'warn'), 10000);
  ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(slow); status('실시간 연동 중', 'ok'); }
    if (snap.metadata.hasPendingWrites || dirty || saving) return;
    if (!snap.exists) { if (!snap.metadata.fromCache) seedRemote(); return; }
    const d = snap.data() || {};
    const remote = normalize({ cells: d.cells });
    const json = JSON.stringify(remote);
    lastSaved = json;
    const nextPhoto = typeof d.photo === 'string' ? d.photo : DEFAULT_PHOTO;
    if (json !== JSON.stringify(S) || nextPhoto !== photo) { S = remote; photo = nextPhoto; prev = null; lsSet(); selected = null; $('menu').hidden = true; render(); }
  }, err => { clearTimeout(slow); status('서버 연결 실패 · 이 기기에만 저장 중', 'warn'); boardRef = null; photoRef = null; });

  histRef.onSnapshot(snap => { fb.history = (snap.exists && Array.isArray(snap.data().items)) ? snap.data().items : []; if (!$('histModal').hidden) drawHistory(); }, () => {});
}
async function pushHistory(histRef) {
  // 서버에 있던 직전 상태를 기록. 1분 안에 연속으로 고친 건 한 번만 남김
  if (!lastSaved) return;
  const items = (fb.history || []).slice();
  const last = items[items.length - 1];
  if (last && (Date.now() - last.at < HIST_GAP_MS || JSON.stringify(normalize({ cells: last.cells })) === lastSaved)) return;
  items.push({ at: Date.now(), cells: JSON.parse(lastSaved).cells });
  while (items.length > HIST_MAX) items.shift();
  fb.history = items;
  try { await histRef.set({ items }); } catch (_) {}
}
async function seedRemote() {
  if (seedRemote.done) return; seedRemote.done = true;
  try { await boardRef.set(S); await photoRef.set({ data: photo || '' }); lastSaved = JSON.stringify(S); } catch (_) {}
}
function drawHistory() {
  const items = (fb.history || []).slice().reverse();
  const fmt = t => new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  $('histList').innerHTML = items.length ? items.map((h, k) => {
    const n = (h.cells || []).slice(0, N).reduce((a, c) => a + ((c && c.names) ? c.names.length : 0), 0);
    return `<div class="item"><span class="when">${fmt(h.at)}</span><span class="cnt">닉네임 ${n}명</span><button type="button" class="btn" data-k="${k}">복원</button></div>`;
  }).join('') : '<p>아직 저장된 이전 상태가 없습니다. 도감을 수정하면 그때부터 쌓입니다.</p>';
  $('histList').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '정말 복원'; b.classList.add('primary'); return; }
    const h = items[+b.dataset.k];
    change(() => { S = normalize({ cells: h.cells }); });
    $('histModal').hidden = true; toast(`${fmt(h.at)} 상태로 복원했습니다`, 3000);
  });
}
$('histBtn').onclick = e => { e.stopPropagation(); hideMenu(); drawHistory(); $('histModal').hidden = false; };
</script>
